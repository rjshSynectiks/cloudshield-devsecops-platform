name: CloudShield Trivy Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem-scan:
    name: Repository Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_DEBUG: "true"
        with:
          version: "latest"
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-filesystem.sarif
          ignore-unfixed: true

      - name: Upload filesystem scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: trivy-filesystem.sarif
          if-no-files-found: ignore

  image-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull -t cloudshield-api:${{ github.sha }} .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: "latest"
          scan-type: image
          image-ref: cloudshield-api:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true

      - name: Upload image scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.sarif
          if-no-files-found: ignore