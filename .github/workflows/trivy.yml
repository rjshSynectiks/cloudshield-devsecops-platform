```yaml
name: CloudShield Trivy Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  filesystem-scan:
    name: Scan Repository for Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

**What this does:**
- `vuln` — checks dependencies for known vulnerabilities.
- `misconfig` — checks for certain security misconfigurations.
- `secret` — looks for exposed secrets.
- `HIGH,CRITICAL` — focuses on high- and critical-severity findings.
- `exit-code: "1"` — fails the workflow if matching findings are detected.

The workflow uses a version tag for the Trivy action. For stronger supply-chain security, we can pin third-party actions to verified full commit SHAs in a later step.

### Step 3 — Save and test

Save the file using **Ctrl + S**.

In the VS Code terminal, run:

```powershell
git status
```

You should see `.github/workflows/trivy.yml` as an untracked file.

Then run:

```powershell
git add .github/workflows/trivy.yml
git commit -m "Add Trivy security scanning"
git push
```

